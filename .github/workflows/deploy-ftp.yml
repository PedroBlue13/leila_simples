name: Deploy via FTP

on:
  push:
    branches:
      - prod

permissions:
  contents: read

concurrency:
  group: deploy-ftp-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar pasta dist
        run: |
          mkdir -p dist
          cp index.html Leila.html compartilhar.zip dist/
          cp -R assets compartilhar dist/

      - name: Enviar arquivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          port: ${{ secrets.PORT }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /home/leilabiasuz1/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            tmp/**
            **/__pycache__/**
